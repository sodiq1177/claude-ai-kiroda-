<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語 — Flashcard & Test (AI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F1E8;          /* warm cream background */
    --ink:#2B1B0E;         /* main dark text */
    --muted:#8A7A65;       /* furigana / secondary */
    --accent:#C97A40;      /* accent */
    --accent-2:#E0995A;
    --correct:#4F7A3D;     /* correct */
    --wrong:#B24A3D;       /* wrong */
    --card-front:#fff8ec;  /* ivory card front */
    --card-back:#1a0f3c;   /* dark navy card back */
    --card-back-text:#F5E6C8;
    --line:rgba(43,27,14,0.12);
    --line2:rgba(43,27,14,0.20);
    --paper:#FBF8F1;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP','Inter',sans-serif;min-height:100%;}
  body{display:flex;justify-content:center;}
  #root{width:100%;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(43,27,14,0.18);border-radius:8px;}

  /* ---- App shell ---- */
  .app{max-width:460px;margin:0 auto;min-height:100vh;padding:0 0 90px;position:relative;}
  .topbar{position:sticky;top:0;z-index:50;background:rgba(245,241,232,0.92);backdrop-filter:blur(8px);
          border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px;}
  .topbar .ttl{font-family:'Cinzel',serif;font-weight:600;font-size:18px;letter-spacing:.04em;color:var(--ink);flex:1;}
  .topbar .jp{font-family:'Noto Serif JP',serif;color:var(--accent);font-weight:700;}
  .iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--paper);
           display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink);transition:.15s;}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent);}
  .iconbtn.ghost{border:none;background:transparent;}

  .wrap{padding:18px;}
  .pop{animation:pop .32s cubic-bezier(.2,.8,.2,1);}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:none;}}
  .slide{animation:slide .3s ease;}
  @keyframes slide{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}

  .section-title{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.06em;color:var(--muted);
                 text-transform:uppercase;margin:4px 2px 12px;font-weight:600;}

  /* ---- Deck cards ---- */
  .deck-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .deck{border-radius:18px;padding:15px 15px 13px;color:#fff;position:relative;overflow:hidden;
        min-height:128px;display:flex;flex-direction:column;justify-content:space-between;
        box-shadow:0 6px 18px rgba(43,27,14,0.12);transition:transform .12s, box-shadow .2s;border:none;text-align:left;}
  .deck:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(43,27,14,0.2);}
  .deck .emoji{font-size:26px;}
  .deck .dname{font-family:'Noto Serif JP',serif;font-weight:700;font-size:16px;line-height:1.25;margin-top:6px;
               text-shadow:0 1px 4px rgba(0,0,0,.25);}
  .deck .dprev{font-family:'Noto Serif JP',serif;font-size:12.5px;opacity:.9;margin-top:5px;line-height:1.5;
               display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .deck .dcount{position:absolute;top:13px;right:13px;background:rgba(255,255,255,0.22);border-radius:20px;
                padding:2px 9px;font-size:11px;font-weight:600;}
  .deck-add{border:2px dashed var(--line2);border-radius:18px;background:var(--paper);color:var(--accent);
            min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
            font-weight:600;font-size:14px;transition:.15s;}
  .deck-add:hover{border-color:var(--accent);background:#fff;}
  .deck-add .plus{font-size:30px;line-height:1;}

  /* ---- Generic buttons ---- */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;
       border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;font-weight:600;transition:.15s;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent-2);}
  .btn.dark{background:var(--card-back);color:var(--card-back-text);border-color:var(--card-back);}
  .btn.sm{padding:10px 14px;width:auto;font-size:13px;border-radius:12px;}
  .btn.danger{color:var(--wrong);border-color:rgba(178,74,61,.4);}
  .btn.danger:hover{background:rgba(178,74,61,.08);}
  .row{display:flex;gap:10px;}
  .stack{display:flex;flex-direction:column;gap:11px;}

  .crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--muted);font-size:13px;}
  .crumb b{color:var(--ink);font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;}
  .pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .pill{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12.5px;
        display:flex;align-items:center;gap:6px;color:var(--muted);}
  .pill b{color:var(--ink);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* ---- Group select ---- */
  .group-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .group{border-radius:15px;padding:16px 14px;color:#fff;border:none;text-align:left;min-height:84px;
         display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s;box-shadow:0 5px 14px rgba(43,27,14,.12);}
  .group:hover{transform:translateY(-2px);}
  .group .gnum{font-family:'Cinzel',serif;font-weight:700;font-size:16px;}
  .group .gmeta{font-size:12px;opacity:.92;margin-top:6px;}
  .group.full{grid-column:span 2;flex-direction:row;align-items:center;justify-content:space-between;}
  .qlist{display:flex;flex-direction:column;gap:10px;}
  .qrow{border-radius:14px;padding:14px 16px;color:#fff;border:none;display:flex;align-items:center;justify-content:space-between;
        box-shadow:0 4px 12px rgba(43,27,14,.12);transition:transform .12s;}
  .qrow:hover{transform:translateX(3px);}
  .qrow .qt{font-weight:700;font-family:'Cinzel',serif;}
  .qrow .qm{font-size:12px;opacity:.92;}

  /* ---- Flashcard ---- */
  .fc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .fc-count{font-family:'Cinzel',serif;color:var(--muted);font-size:14px;letter-spacing:.05em;}
  .progress{height:7px;background:rgba(43,27,14,.1);border-radius:10px;overflow:hidden;margin-bottom:18px;}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .35s;}
  .scene{perspective:1200px;width:100%;height:360px;margin-bottom:18px;}
  .flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .58s cubic-bezier(.4,0,.2,1);cursor:pointer;}
  .flip.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;
        box-shadow:0 12px 34px rgba(43,27,14,.18);}
  .face.front{background:var(--card-front);border:1px solid var(--line);}
  .face.front .kanji{font-family:'Noto Serif JP',serif;font-weight:700;color:var(--ink);font-size:62px;line-height:1.12;word-break:break-word;}
  .face.front .hint{position:absolute;bottom:18px;color:var(--muted);font-size:12px;font-family:'Cinzel',serif;letter-spacing:.05em;}
  .face.front .jlpt{position:absolute;top:18px;right:18px;}
  .face.back{background:var(--card-back);transform:rotateY(180deg);border:1px solid var(--card-back);}
  .face.back .mean{color:var(--card-back-text);font-size:1.5rem;font-weight:700;line-height:1.3;margin-bottom:12px;}
  .face.back .read{color:var(--accent-2);font-size:1.35rem;font-family:'Noto Sans JP',sans-serif;margin-bottom:16px;}
  .face.back .sent{color:#d9cfe8;font-family:'Noto Serif JP',serif;font-size:14px;line-height:1.9;border-top:1px solid rgba(255,255,255,.15);padding-top:14px;width:100%;}
  .face.back .sent .uz{color:#a99fc4;font-size:12px;display:block;margin-top:5px;}
  .jlpt-badge{font-family:'Cinzel',serif;font-weight:700;font-size:11px;padding:3px 9px;border-radius:20px;letter-spacing:.04em;}

  /* ---- Quiz ---- */
  .q-scorebar{display:flex;justify-content:space-around;background:var(--paper);border:1px solid var(--line);
              border-radius:16px;padding:13px;margin-bottom:16px;}
  .q-scorebar .it{text-align:center;}
  .q-scorebar .n{font-family:'Cinzel',serif;font-weight:700;font-size:20px;}
  .q-scorebar .l{font-size:11px;color:var(--muted);margin-top:2px;}
  .q-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;}
  .q-badge{display:inline-block;font-family:'Noto Serif JP',serif;font-size:12px;background:rgba(201,122,64,.12);
           color:var(--accent);border:1px solid rgba(201,122,64,.3);border-radius:20px;padding:3px 12px;margin-bottom:16px;}
  .q-prompt{text-align:center;margin-bottom:20px;}
  .q-prompt .big{font-family:'Noto Serif JP',serif;font-weight:700;font-size:42px;color:var(--ink);line-height:1.15;word-break:break-word;}
  .q-prompt .med{font-size:21px;font-weight:600;color:var(--ink);line-height:1.4;}
  .q-prompt .sub{color:var(--muted);font-size:14px;margin-top:6px;font-family:'Noto Sans JP',sans-serif;}
  .q-opts{display:flex;flex-direction:column;gap:10px;}
  .q-opt{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);
         font-size:16px;text-align:left;transition:.13s;font-family:'Noto Serif JP',serif;line-height:1.4;}
  .q-opt:hover:not(:disabled){border-color:var(--accent);}
  .q-opt:disabled{cursor:default;}
  .q-opt.correct{border-color:var(--correct);background:rgba(79,122,61,.12);color:var(--correct);font-weight:700;}
  .q-opt.wrong{border-color:var(--wrong);background:rgba(178,74,61,.12);color:var(--wrong);}
  .q-feedback{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .q-feedback .fmsg{font-weight:700;margin-bottom:8px;}
  .q-feedback .ok{color:var(--correct);}
  .q-feedback .no{color:var(--wrong);}
  .q-feedback .ans{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.7;}
  .q-feedback .ans .k{font-family:'Noto Serif JP',serif;font-weight:700;font-size:18px;}
  .q-feedback .ans .r{color:var(--accent);}
  .q-feedback .ans .m{color:var(--muted);}

  /* ---- Result ---- */
  .result{text-align:center;padding:24px 6px;}
  .result .score{font-family:'Cinzel',serif;font-size:54px;font-weight:700;color:var(--accent);}
  .result .grade{font-family:'Noto Serif JP',serif;font-size:22px;margin:6px 0 4px;}
  .result .sub{color:var(--muted);margin-bottom:20px;}
  .wrong-list{text-align:left;margin:16px 0;display:flex;flex-direction:column;gap:8px;}
  .wrong-item{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--wrong);border-radius:10px;padding:11px 13px;}
  .wrong-item .k{font-family:'Noto Serif JP',serif;font-weight:700;font-size:17px;}
  .wrong-item .r{color:var(--accent);font-size:13px;}
  .wrong-item .m{color:var(--muted);font-size:13px;}

  /* ---- Word list (manage) ---- */
  .wcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;}
  .wcard .wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .wcard .wk{font-family:'Noto Serif JP',serif;font-weight:700;font-size:20px;color:var(--ink);}
  .wcard .wr{color:var(--accent);font-size:13px;font-family:'Noto Sans JP',sans-serif;margin-top:1px;}
  .wcard .wm{color:var(--ink);font-size:14px;margin-top:5px;}
  .wcard .ws{color:var(--muted);font-size:12.5px;font-family:'Noto Serif JP',serif;margin-top:6px;line-height:1.7;}
  .wcard .wact{display:flex;gap:6px;}
  .miniicon{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .miniicon:hover{border-color:var(--accent);}
  .search{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--paper);font-size:14px;color:var(--ink);margin-bottom:14px;font-family:inherit;}
  .search:focus{outline:none;border-color:var(--accent);}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(43,27,14,.42);backdrop-filter:blur(3px);z-index:200;
           display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .2s;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal{background:var(--bg);width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:20px 18px 26px;
         max-height:92vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes up{from{transform:translateY(40px);opacity:.5;}to{transform:none;opacity:1;}}
  .modal h3{font-family:'Noto Serif JP',serif;font-size:19px;margin-bottom:4px;}
  .modal .msub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field textarea,.field select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);
       background:var(--paper);font-size:15px;color:var(--ink);font-family:inherit;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:54px;font-family:'Noto Serif JP',serif;}
  .field .jp{font-family:'Noto Serif JP',serif;}
  .emoji-pick{display:flex;flex-wrap:wrap;gap:7px;}
  .emoji-pick button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:21px;}
  .emoji-pick button.sel{border-color:var(--accent);background:#fff;box-shadow:0 0 0 2px rgba(201,122,64,.25);}
  .note{font-size:12px;color:var(--muted);line-height:1.6;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px;}
  .err{background:rgba(178,74,61,.1);border:1px solid rgba(178,74,61,.3);color:var(--wrong);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;}
  .spinner.dark{border-color:rgba(43,27,14,.25);border-top-color:var(--accent);}
  @keyframes spin{to{transform:rotate(360deg);}}

  .empty{text-align:center;color:var(--muted);padding:50px 20px;}
  .empty .em{font-size:40px;margin-bottom:10px;}
  .fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:460px;width:calc(100% - 36px);z-index:40;}
  .ai-preview{background:var(--card-back);color:var(--card-back-text);border-radius:16px;padding:16px;margin:14px 0;}
  .ai-preview .pk{font-family:'Noto Serif JP',serif;font-size:28px;font-weight:700;}
  .ai-preview .pr{color:var(--accent-2);font-size:15px;margin-top:2px;}
  .ai-preview .pm{font-size:16px;margin-top:8px;}
  .ai-preview .psent{font-family:'Noto Serif JP',serif;font-size:13.5px;line-height:1.8;margin-top:10px;color:#d9cfe8;border-top:1px solid rgba(255,255,255,.15);padding-top:10px;}
  .ai-preview .psent .uz{display:block;color:#a99fc4;font-size:12px;margin-top:4px;}
  .tag-jlpt{font-size:11px;font-weight:700;padding:2px 8px;border-radius:14px;font-family:'Cinzel',serif;}
</style>
</head>
<body>
<div id="root"></div>

  'linear-gradient(135deg,#6B4A8C,#9266b8)',
  'linear-gradient(135deg,#4F7A3D,#6fa356)',

/* ============ Helpers ============ */
let _idc = 0;
const uid = () => 'c' + Date.now().toString(36) + (_idc++).toString(36) + Math.floor(Math.random()*1e4).toString(36);
const chunk = (arr, n) => { const o=[]; for(let i=0;i<arr.length;i+=n) o.push(arr.slice(i,i+n)); return o; };
const shuffle = (arr) => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function loadDecks(){
  try{
    const raw = localStorage.getItem(LS.decks);
    if(raw){ const d = JSON.parse(raw); if(Array.isArray(d) && d.length) return d; }
  }catch(e){}
  return [ buildSeedDeck() ];
}
function buildSeedDeck(){
  let seed = { name:'Basic 0', cards:[] };
  try{
    const raw = JSON.parse(document.getElementById('seed-data').textContent);
    const cards = (raw.cards||[]).map(c => ({
      id: uid(),
      kanji: (c.o||'').trim(),
      hiragana: '',
      uzbek: (Array.isArray(c.t)? c.t : [c.t]).map(x=>String(x||'').trim()).filter(Boolean).join(', '),
      jlpt: '',
      sentence: '',
      sentenceUz: ''
    })).filter(c => c.kanji);
    seed = { name: raw.name || 'Basic 0', cards };
  }catch(e){ console.warn('seed parse failed', e); }
  const pretty = (seed.name||'Basic 0').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  return { id: uid(), name: pretty, emoji:'📚', cards: seed.cards };
}

/* ============ Storage hook ============ */
function useLocalState(key, initial){
  const [val, setVal] = useState(()=>{
    try{ const r = localStorage.getItem(key); return r!=null ? JSON.parse(r) : initial; }catch(e){ return initial; }
  });
  useEffect(()=>{ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }, [key, val]);
  return [val, setVal];
}

/* ============ Claude AI ============ */
async function callClaude(term, apiKey, model){
  const prompt =
`You are a Japanese vocabulary assistant for an Uzbek learner.
The user gives a term that is either a Japanese word (kanji/kana) or an Uzbek word.
Term: "${term}"

Return ONLY one strict JSON object (no markdown, no commentary) with EXACTLY these keys:
{"kanji":"<the Japanese word as normally written>","hiragana":"<reading in hiragana only>","uzbek":"<short Uzbek meaning in latin script>","jlpt":"<one of N5,N4,N3,N2,N1>","sentence":"<one natural example sentence in Japanese that uses the word>","sentenceUz":"<Uzbek translation of that sentence>"}

Rules: hiragana must be kana only. jlpt is your best estimate. Keep uzbek concise. Output valid JSON only.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: model || DEFAULT_MODEL,
      max_tokens: 600,
      messages:[{ role:'user', content: prompt }]
    })
  });
  if(!res.ok){
    let detail='';
    try{ const e = await res.json(); detail = e.error?.message || JSON.stringify(e); }catch(_){ detail = await res.text(); }
    throw new Error('API ('+res.status+'): ' + detail);
  }
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.text||'').join('').trim();
  let obj;
  try{ obj = JSON.parse(text); }
  catch(e){
    const m = text.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('AI javobini o\'qib bo\'lmadi: ' + text.slice(0,160));
    obj = JSON.parse(m[0]);
  }
  return {
    kanji:(obj.kanji||term).trim(),
    hiragana:(obj.hiragana||'').trim(),
    uzbek:(obj.uzbek||'').trim(),
    jlpt: JLPT_LEVELS.includes((obj.jlpt||'').toUpperCase().trim()) ? obj.jlpt.toUpperCase().trim() : '',
    sentence:(obj.sentence||'').trim(),
    sentenceUz:(obj.sentenceUz||'').trim()
  };
}

/* ============ Word form (add/edit) ============ */
function WordForm({initial, onSave, onCancel, apiKey, model}){
  const [f, setF] = useState(initial || {kanji:'',hiragana:'',uzbek:'',jlpt:'',sentence:'',sentenceUz:''});
  const [enriching, setEnriching] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v)=> setF(p=>({...p,[k]:v}));

  async function enrich(){
    if(!apiKey){ setErr('Avval ⚙️ Sozlamalardan Claude API kalitini kiriting.'); return; }
    if(!f.kanji.trim()){ setErr('Avval so\'zni (kanji) kiriting.'); return; }
    setErr(''); setEnriching(true);
    try{
      const r = await callClaude(f.kanji.trim(), apiKey, model);
      setF(p=>({
        kanji: p.kanji || r.kanji,
        hiragana: p.hiragana || r.hiragana,
        uzbek: p.uzbek || r.uzbek,
        jlpt: p.jlpt || r.jlpt,
        sentence: p.sentence || r.sentence,
        sentenceUz: p.sentenceUz || r.sentenceUz
      }));
    }catch(e){ setErr(e.message); }
    setEnriching(false);
  }

  return (
    <div>
      {err && <div className="err">{err}</div>}
      <div className="field">
        <label>So'z (kanji / kana) *</label>
        <input className="jp" value={f.kanji} onChange={e=>set('kanji',e.target.value)} placeholder="例: 成功" />
      </div>
      <button className="btn dark sm" style={{width:'100%',marginBottom:13}} onClick={enrich} disabled={enriching}>
        {enriching ? <><span className="spinner"></span> AI to'ldirmoqda...</> : '🤖 AI bilan to\'ldirish (o\'qilishi, daraja, gap)'}
      </button>
      <div className="field">
        <label>O'qilishi (hiragana)</label>
        <input className="jp" value={f.hiragana} onChange={e=>set('hiragana',e.target.value)} placeholder="せいこう" />
      </div>
      <div className="field">
        <label>Tarjima (uzbek) *</label>
        <input value={f.uzbek} onChange={e=>set('uzbek',e.target.value)} placeholder="muvaffaqiyat" />
      </div>
      <div className="field">
        <label>JLPT daraja</label>
        <select value={f.jlpt} onChange={e=>set('jlpt',e.target.value)}>
          <option value="">— belgilanmagan —</option>
          {JLPT_LEVELS.map(l=><option key={l} value={l}>{l}</option>)}
        </select>
      </div>
      <div className="field">
        <label>Misol gap (yapon)</label>
        <textarea className="jp" value={f.sentence} onChange={e=>set('sentence',e.target.value)} placeholder="例文..." />
      </div>
      <div className="field">
        <label>Gap tarjimasi (uzbek)</label>
        <textarea value={f.sentenceUz} onChange={e=>set('sentenceUz',e.target.value)} />
      </div>
      <div className="row" style={{marginTop:8}}>
        <button className="btn" onClick={onCancel}>Bekor qilish</button>
        <button className="btn primary" onClick={()=>{
          if(!f.kanji.trim() || !f.uzbek.trim()){ setErr('So\'z va tarjima majburiy.'); return; }
          onSave({...f, kanji:f.kanji.trim(), uzbek:f.uzbek.trim()});
        }}>Saqlash</button>
      </div>
    </div>
  );
}

/* ============ Flashcard runner ============ */
function Flashcards({cards, deckName, known, setKnown, onExit}){
  const total = cards.length;
  const [queue, setQueue] = useState(()=>shuffle(cards));
  const [flipped, setFlipped] = useState(false);
  const [doneCount, setDoneCount] = useState(0);

  const current = queue[0];
  const finished = queue.length === 0;

  function mark(ok){
    if(!current) return;
    if(ok){
      setKnown(current.id, true);
      setQueue(q=>q.slice(1));
      setDoneCount(c=>c+1);
    }else{
      setKnown(current.id, false);
      setQueue(q=> q.length>1 ? [...q.slice(1), q[0]] : q ); // back of deck, repeat
    }
    setFlipped(false);
  }

  if(finished){
    return (
      <div className="result pop">
        <div style={{fontSize:46,marginBottom:8}}>🎉</div>
        <div className="score">{total}</div>
        <div className="grade">Hammasi takrorlandi!</div>
        <div className="sub">{deckName} — barcha {total} ta so'zni "bildim" deb belgiladingiz.</div>
        <div className="stack" style={{marginTop:10}}>
          <button className="btn primary" onClick={()=>{ setQueue(shuffle(cards)); setDoneCount(0); }}>🔁 Qayta boshlash</button>
          <button className="btn" onClick={onExit}>← Orqaga</button>
        </div>
      </div>
    );
  }

  return (
    <div className="pop">
      <div className="fc-top">
        <button className="iconbtn" onClick={onExit}>←</button>
        <span className="fc-count">{doneCount} / {total}</span>
        <span style={{width:38}}></span>
      </div>
      <div className="progress"><i style={{width:(total? (doneCount/total*100):0)+'%'}}></i></div>

      <div className="scene">
        <div className={'flip'+(flipped?' flipped':'')} onClick={()=>setFlipped(f=>!f)}>
          <div className="face front">
            <JlptTag level={current.jlpt} />
            <div className="jlpt" />
            <div className="kanji">{current.kanji}</div>
            <div className="hint">— bosing —</div>
          </div>
          <div className="face back">
            <div className="mean">{current.uzbek}</div>
            {current.hiragana && <div className="read">{current.hiragana}</div>}
            {current.sentence
              ? <div className="sent">{current.sentence}{current.sentenceUz && <span className="uz">{current.sentenceUz}</span>}</div>
              : <div className="sent" style={{color:'#8a80a4',fontSize:12}}>misol gap yo'q — 🤖 AI bilan to'ldiring</div>}
          </div>
        </div>
      </div>

      <div className="row">
        <button className="btn" style={{borderColor:'rgba(178,74,61,.4)',color:'var(--wrong)'}} onClick={()=>mark(false)}>✗ Bilmadim</button>
        <button className="btn" style={{borderColor:'rgba(79,122,61,.5)',color:'var(--correct)'}} onClick={()=>mark(true)}>✓ Bildim</button>
      </div>
      <p style={{textAlign:'center',color:'var(--muted)',fontSize:12,marginTop:12}}>"Bilmadim" — so'z talaning oxiriga qaytadi va takrorlanadi.</p>
    </div>
  );
}

/* ============ Quiz builder ============ */
function buildQuestions(cards){
  const pool = cards;
  const kanjiPool = pool.map(c=>c.kanji).filter(Boolean);
  const hiraPool = pool.map(c=>c.hiragana).filter(Boolean);

  function distractors(sourcePool, correct, n){
    const opts = shuffle(sourcePool.filter(v=>v && v!==correct));
    const uniq = [];
    for(const v of opts){ if(!uniq.includes(v)) uniq.push(v); if(uniq.length>=n) break; }
    return uniq;
  }

  return shuffle(cards).map(card=>{
    const types = ['meaning'];
    if(card.hiragana && hiraPool.length>=2){ types.push('reading','kanji'); }
    if(card.sentence && card.kanji && card.sentence.includes(card.kanji)){ types.push('fill'); }
    const type = types[Math.floor(Math.random()*types.length)];

    let promptBig='', promptMed='', promptSub='', correct='', optionPool=[], badge='';
    if(type==='meaning'){ // show uzbek -> pick kanji
      promptMed = card.uzbek; correct = card.kanji; optionPool = kanjiPool; badge='意味';
    }else if(type==='reading'){ // show kanji -> pick hiragana
      promptBig = card.kanji; correct = card.hiragana; optionPool = hiraPool; badge='読み方';
    }else if(type==='kanji'){ // show hiragana -> pick kanji
      promptMed = card.hiragana; promptSub = card.uzbek; correct = card.kanji; optionPool = kanjiPool; badge='漢字';
    }else if(type==='fill'){ // sentence blank -> pick kanji
      promptMed = card.sentence.split(card.kanji).join('（ ＿＿ ）'); correct = card.kanji; optionPool = kanjiPool; badge='穴埋め';
    }
    const opts = shuffle([correct, ...distractors(optionPool, correct, 3)]);
    return { card, type, badge, promptBig, promptMed, promptSub, correct, options: opts };
  });
}

function Quiz({cards, deckName, known, setKnown, onExit}){
  const [questions] = useState(()=>buildQuestions(cards));
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState({c:0,w:0});
  const [wrongList, setWrongList] = useState([]);
  const timer = useRef(null);

  useEffect(()=>()=>{ if(timer.current) clearTimeout(timer.current); }, []);

  const q = questions[idx];
  const finished = idx >= questions.length;

  function choose(opt){
    if(selected!=null || !q) return;
    setSelected(opt);
    const ok = opt === q.correct;
    if(ok){
      setScore(s=>({...s,c:s.c+1}));
      setKnown(q.card.id, true);
      timer.current = setTimeout(()=>next(), 650);
    }else{
      setScore(s=>({...s,w:s.w+1}));
      setKnown(q.card.id, false);
      setWrongList(l=>[...l, q.card]);
    }
  }
  function next(){ setSelected(null); setIdx(i=>i+1); }

  if(finished){
    const totalQ = questions.length;
    const pct = totalQ? Math.round(score.c/totalQ*100) : 0;
    const grade = pct>=90?'🏆 Ajoyib!':pct>=70?'👍 Yaxshi!':pct>=50?'📚 Davom eting':'💪 Mashq kerak';
    return (
      <div className="result pop">
        <div className="score">{pct}%</div>
        <div className="grade">{grade}</div>
        <div className="sub">{totalQ} ta savoldan {score.c} tasi to'g'ri</div>
        {wrongList.length>0 && (
          <div>
            <div className="section-title" style={{marginTop:18}}>Xato qilganlaringiz</div>
            <div className="wrong-list">
              {wrongList.map((c,i)=>(
                <div className="wrong-item" key={i}>
                  <span className="k">{c.kanji}</span>{' '}
                  {c.hiragana && <span className="r">{c.hiragana}</span>}
                  <div className="m">{c.uzbek}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        <div className="stack" style={{marginTop:14}}>
          <button className="btn primary" onClick={()=>onExit('retry')}>🔁 Qayta urinish</button>
          <button className="btn" onClick={()=>onExit()}>← Orqaga</button>
        </div>
      </div>
    );
  }

  return (
    <div className="pop">
      <div className="fc-top">
        <button className="iconbtn" onClick={()=>onExit()}>←</button>
        <span className="fc-count">SAVOL {idx+1} / {questions.length}</span>
        <span style={{width:38}}></span>
      </div>
      <div className="q-scorebar">
        <div className="it"><div className="n" style={{color:'var(--correct)'}}>{score.c}</div><div className="l">To'g'ri</div></div>
        <div className="it"><div className="n" style={{color:'var(--wrong)'}}>{score.w}</div><div className="l">Xato</div></div>
        <div className="it"><div className="n" style={{color:'var(--accent)'}}>{questions.length-idx}</div><div className="l">Qoldi</div></div>
      </div>

      <div className="q-card slide" key={idx}>
        <span className="q-badge">{q.badge}</span>
        <div className="q-prompt">
          {q.promptBig && <div className="big">{q.promptBig}</div>}
          {q.promptMed && <div className="med">{q.promptMed}</div>}
          {q.promptSub && <div className="sub">{q.promptSub}</div>}
        </div>
        <div className="q-opts">
          {q.options.map((opt,i)=>{
            let cls='q-opt';
            if(selected!=null){
              if(opt===q.correct) cls+=' correct';
              else if(opt===selected) cls+=' wrong';
            }
            return <button key={i} className={cls} disabled={selected!=null} onClick={()=>choose(opt)}>{opt}</button>;
          })}
        </div>

        {selected!=null && selected!==q.correct && (
          <div className="q-feedback">
            <div className="fmsg no">✗ Noto'g'ri</div>
            <div className="ans">
              <span className="k">{q.card.kanji}</span>{' '}
              {q.card.hiragana && <span className="r">{q.card.hiragana}</span>}
              <div className="m">{q.card.uzbek}</div>
              {q.card.sentence && <div style={{marginTop:6,fontFamily:"'Noto Serif JP',serif"}}>{q.card.sentence}</div>}
            </div>
            <button className="btn primary" style={{marginTop:12}} onClick={next}>Keyingi savol →</button>
          </div>
        )}
        {selected!=null && selected===q.correct && (
          <div className="q-feedback"><div className="fmsg ok">✓ To'g'ri!</div></div>
        )}
      </div>
    </div>
  );
}

/* ============ Main App ============ */
function App(){
  const [decks, setDecks] = useLocalState(LS.decks, null);
  const [knownMap, setKnownMap] = useLocalState(LS.known, {});
  const [settings, setSettings] = useLocalState(LS.api, {key:'', model:DEFAULT_MODEL});

  // initialize decks once
  useEffect(()=>{ if(decks===null){ setDecks(loadDecks()); } }, []);

  const [nav, setNav] = useState({screen:'decks'}); // decks | home | flashGroups | quizGroups | flash | quiz | words
  const [modal, setModal] = useState(null); // {type:'settings'|'newDeck'|'addWord'|'editWord'|'aiAdd'}
  const [search, setSearch] = useState('');

  const dks = decks || [];
  const activeDeck = dks.find(d=>d.id===nav.deckId) || null;

  function setKnown(id, val){ setKnownMap(m=>{ const n={...m}; if(val) n[id]=true; else delete n[id]; return n; }); }
  const isKnown = (id)=> !!knownMap[id];

  /* deck ops */
  function addDeck(name, emoji){
    const d = { id: uid(), name: name.trim()||'Yangi bo\'lim', emoji: emoji||'📚', cards:[] };
    setDecks(ds=>[...(ds||[]), d]);
    setModal(null);
    setNav({screen:'home', deckId:d.id});
  }
  function deleteDeck(id){
    if(!window.confirm('Bu bo\'limni va undagi barcha so\'zlarni o\'chirishni xohlaysizmi?')) return;
    setDecks(ds=>ds.filter(d=>d.id!==id));
    setNav({screen:'decks'});
  }
  function updateDeckCards(deckId, fn){
    setDecks(ds=>ds.map(d=> d.id===deckId ? {...d, cards: fn(d.cards)} : d));
  }
  function addCard(deckId, card){
    updateDeckCards(deckId, cs=>[{...card, id: uid()}, ...cs]);
  }
  function updateCard(deckId, cardId, card){
    updateDeckCards(deckId, cs=>cs.map(c=>c.id===cardId?{...c,...card}:c));
  }
  function deleteCard(deckId, cardId){
    updateDeckCards(deckId, cs=>cs.filter(c=>c.id!==cardId));
  }

  /* export / import */
  function exportData(){
    const blob = new Blob([JSON.stringify({decks:dks, known:knownMap}, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nihongo_backup.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function importData(file){
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const obj = JSON.parse(r.result);
        if(Array.isArray(obj.decks)){ setDecks(obj.decks); if(obj.known) setKnownMap(obj.known); alert('Import muvaffaqiyatli!'); setModal(null); }
        else alert('Noto\'g\'ri fayl.');
      }catch(e){ alert('Faylni o\'qib bo\'lmadi: '+e.message); }
    };
    r.readAsText(file);
  }

  const totalCards = dks.reduce((s,d)=>s+d.cards.length,0);

  /* ---------- screens ---------- */
  function DeckSelect(){
    return (
      <div className="wrap pop">
        <div className="pillrow">
          <span className="pill"><span className="dot" style={{background:'var(--accent)'}}></span><b>{dks.length}</b> bo'lim</span>
          <span className="pill"><span className="dot" style={{background:'var(--ink)'}}></span><b>{totalCards}</b> so'z</span>
          <span className="pill"><span className="dot" style={{background:'var(--correct)'}}></span><b>{Object.keys(knownMap).length}</b> bilingan</span>
        </div>
        <div className="section-title">Bo'limlar</div>
        <div className="deck-grid">
          {dks.map((d,i)=>(
            <button key={d.id} className="deck" style={{background:DECK_GRADIENTS[i%DECK_GRADIENTS.length]}}
                    onClick={()=>setNav({screen:'home', deckId:d.id})}>
              <span className="dcount">{d.cards.length}</span>
              <span className="emoji">{d.emoji}</span>
              <div>
                <div className="dname">{d.name}</div>
                <div className="dprev">{d.cards.slice(0,8).map(c=>c.kanji).join('・') || 'bo\'sh'}</div>
              </div>
            </button>
          ))}
          <button className="deck-add" onClick={()=>setModal({type:'newDeck'})}>
            <span className="plus">+</span>Yangi bo'lim
          </button>
        </div>
      </div>
    );
  }

  function DeckHome(){
    const d = activeDeck;
    if(!d) return null;
    const knownCount = d.cards.filter(c=>isKnown(c.id)).length;
    const enriched = d.cards.filter(c=>c.hiragana).length;
    return (
      <div className="wrap pop">
        <div className="crumb">
          <button className="iconbtn" onClick={()=>setNav({screen:'decks'})}>←</button>

          <b>{d.name}</b>
        </div>
        <div className="pillrow">
          <span className="pill"><b>{d.cards.length}</b> so'z</span>
          <span className="pill" style={{color:'var(--correct)'}}><b>{knownCount}</b> bilingan</span>
          <span className="pill"><b>{enriched}</b> 🤖 to'ldirilgan</span>
        </div>
        <div className="stack">
          <button className="btn primary" disabled={!d.cards.length} onClick={()=>setNav({screen:'flashGroups', deckId:d.id})}>📖 Flashcard ({Math.ceil(d.cards.length/FLASH_SIZE)} ta to'plam)</button>
          <button className="btn dark" disabled={d.cards.length<2} onClick={()=>setNav({screen:'quizGroups', deckId:d.id})}>🧪 Test ({Math.ceil(d.cards.length/QUIZ_SIZE)} ta to'plam)</button>

        </div>

  function QuizGroups(){
    const d = activeDeck; if(!d) return null;
    const groups = chunk(d.cards, QUIZ_SIZE);

      <div className="wrap pop">
        <div className="crumb">

          <b>🧪 Test</b>
        </div>
        <button className="btn dark" style={{marginBottom:14}}
                onClick={()=>setNav({screen:'quiz', deckId:d.id, cards:d.cards})}>▶ Barchasi ({d.cards.length} ta savol)</button>

      )}
      {modal?.type==='editWord' && (
        <Modal title="✏️ So'zni tahrirlash" onClose={()=>setModal(null)}>
          <WordForm initial={modal.card} apiKey={settings.key} model={settings.model}
                    onCancel={()=>setModal(null)}
                    onSave={(card)=>{ updateCard(nav.deckId, modal.card.id, card); setModal(null); }} />
        </Modal>
      )}
      {modal?.type==='aiAdd' && (
        <AiAddModal apiKey={settings.key} model={settings.model}
                    onNeedKey={()=>setModal({type:'settings'})}
                    onAdd={(card)=>{ addCard(nav.deckId || (dks[0]&&dks[0].id), card); setModal(null);
                                     if(!nav.deckId && dks[0]) setNav({screen:'words', deckId:dks[0].id}); }}
                    onClose={()=>setModal(null)} />
      )}
    </div>
  );
}

function NewDeckModal({onClose, onCreate}){
  const [name, setName] = useState('');
  const [emoji, setEmoji] = useState(EMOJIS[0]);
  return (
    <Modal title="Yangi bo'lim" sub="So'zlaringizni guruhlash uchun yangi bo'lim oching." onClose={onClose}>
      <div className="field">
        <label>Bo'lim nomi</label>
        <input value={name} autoFocus onChange={e=>setName(e.target.value)} placeholder="masalan: JLPT N3, Sayohat, Ish..." onKeyDown={e=>{if(e.key==='Enter'&&name.trim())onCreate(name,emoji);}}/>
      </div>
      <div className="field">
        <label>Emoji</label>
        <div className="emoji-pick">
          {EMOJIS.map(e=><button key={e} className={emoji===e?'sel':''} onClick={()=>setEmoji(e)}>{e}</button>)}
        </div>
      </div>
      <button className="btn primary" disabled={!name.trim()} onClick={()=>onCreate(name,emoji)}>Yaratish</button>
    </Modal>
  );
}

function SettingsModal({settings, setSettings, onClose, onExport, onImport}){
  const [key, setKey] = useState(settings.key||'');
  const [model, setModel] = useState(settings.model||DEFAULT_MODEL);
  const fileRef = useRef();
  return (
    <Modal title="⚙️ Sozlamalar" onClose={onClose}>
      <div className="section-title" style={{margin:'2px 0 10px'}}>Claude AI</div>
      <div className="field">
        <label>Anthropic API kaliti</label>
        <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-..." />
      </div>
      <div className="field">
        <label>Model</label>
        <select value={model} onChange={e=>setModel(e.target.value)}>
          <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku (tez, arzon)</option>
          <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet (aniqroq)</option>
          <option value="claude-3-7-sonnet-20250219">Claude 3.7 Sonnet</option>
          <option value="claude-sonnet-4-20250514">Claude Sonnet 4 (eng kuchli)</option>
        </select>
      </div>
      <button className="btn primary" onClick={()=>{ setSettings({key:key.trim(), model}); onClose(); }}>Saqlash</button>
      <div className="note" style={{marginTop:12}}>
        🔒 Kalit faqat shu brauzeringizda (localStorage) saqlanadi, hech qayerga yuborilmaydi. So'rovlar to'g'ridan-to'g'ri sizning brauzeringizdan Anthropic'ga ketadi va xarajatlar sizning hisobingizdan yechiladi.
        Kalitni <b>console.anthropic.com</b> dan olasiz.
      </div>

      <div className="section-title" style={{margin:'20px 0 10px'}}>Ma'lumotlar (zaxira)</div>
      <div className="row">
        <button className="btn sm" style={{flex:1}} onClick={onExport}>⬇️ Eksport (JSON)</button>
        <button className="btn sm" style={{flex:1}} onClick={()=>fileRef.current.click()}>⬆️ Import</button>
      </div>
      <input ref={fileRef} type="file" accept="application/json" style={{display:'none'}}
             onChange={e=>{ if(e.target.files[0]) onImport(e.target.files[0]); }} />
    </Modal>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
